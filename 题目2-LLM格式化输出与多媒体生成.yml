app:
  description: 平时作业·题目2（合并版）：LLM 输出格式化限制 + 基于硅基流动的多媒体内容生成。模型：Qwen/Qwen2.5-7B-Instruct
    + Qwen/Qwen-Image
  icon: 🧩
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: advanced-chat
  name: 题目2-LLM格式化输出与多媒体生成
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/siliconflow:0.0.56@146782fa473203f20f37169c191d706f9afc8b75606eeaba965f70800e8d606d
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables:
  - description: 硅基流动 API Key（导入后请填写，形如 sk-xxx；截图时注意打码）
    id: env-siliconflow-key
    name: SILICONFLOW_API_KEY
    selector:
    - env
    - SILICONFLOW_API_KEY
    value: ''
    value_type: string
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: 你好，请描述你想要的图片内容。我会先按 JSON 格式抽取你输入中的信息，再严格按照你的描述生成配图。示例：一只穿着校服的柴犬在图书馆看书，赛博朋克风格，高清细节。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: llm
      id: edge-start-llm
      source: node-start
      sourceHandle: source
      target: node-llm
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: http-request
      id: edge-llm-http
      source: node-llm
      sourceHandle: source
      target: node-http-image
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: http-request
        targetType: code
      id: edge-http-parseimg
      source: node-http-image
      sourceHandle: source
      target: node-parse-image
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: code
        targetType: answer
      id: edge-parseimg-answer
      source: node-parse-image
      sourceHandle: source
      target: node-answer
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables: []
      height: 72
      id: node-start
      position:
        x: 80
        y: 282
      positionAbsolute:
        x: 80
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: LLM 节点：提示词约束输出 JSON
        model:
          completion_params:
            max_tokens: 2048
            temperature: 0.2
          mode: chat
          name: deepseek-ai/DeepSeek-V4-Flash
          provider: langgenius/siliconflow/siliconflow
        prompt_template:
        - id: prompt-system
          role: system
          text: "你是一个信息抽取助手。请从用户输入的文本中抽取信息，并严格按照以下 JSON 格式输出，不要输出任何多余文字、解释或代码块标记：\n\
            \n{\n  \"name\": \"姓名，字符串，没有则填未知\",\n  \"topic\": \"主题，字符串\",\n  \"keywords\"\
            : [\"关键词数组，最多3个\"],\n  \"summary\": \"50字以内的中文摘要\"\n}\n\n要求：\n1. 只输出 JSON，不允许输出\
            \ markdown 代码块符号；\n2. keywords 最多 3 个；\n3. summary 不超过 50 字。"
        - id: prompt-user
          role: user
          text: '{{#sys.query#}}'
        selected: false
        title: LLM-格式化输出
        type: llm
        variables: []
        vision:
          enabled: false
      height: 115
      id: node-llm
      position:
        x: 380
        y: 282
      positionAbsolute:
        x: 380
        y: 282
      selected: true
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 241
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: body-raw
            key: ''
            type: text
            value: "{\n  \"model\": \"Qwen/Qwen-Image\",\n  \"prompt\": \"{{#sys.query#}}\"\
              ,\n  \"image_size\": \"1024x1024\",\n  \"batch_size\": 1\n}"
          type: raw-text
        desc: 调用硅基流动文生图接口，prompt 直接使用用户输入
        headers: 'Authorization: Bearer {{#env.SILICONFLOW_API_KEY#}}

          Content-Type: application/json'
        method: post
        params: ''
        retry_config:
          max_retries: 3
          retry_enabled: true
          retry_interval: 100
        selected: false
        timeout:
          connect: 30
          max_connect_timeout: 300
          max_read_timeout: 600
          read: 120
          write: 20
        title: HTTP-文生图
        type: http-request
        url: https://api.siliconflow.cn/v1/images/generations
        variables: []
      height: 180
      id: node-http-image
      position:
        x: 680
        y: 282
      positionAbsolute:
        x: 680
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 241
    - data:
        code: "def main(body: str) -> dict:\n    import json\n    try:\n        data\
          \ = json.loads(body)\n    except Exception:\n        return {\"image_url\"\
          : \"\", \"raw\": body[:500]}\n    url = \"\"\n    # 硅基流动返回 images 数组\n \
          \   items = data.get(\"images\", [])\n    if items and isinstance(items[0],\
          \ dict):\n        url = items[0].get(\"url\") or \"\"\n    # 兼容 OpenAI 风格\
          \ data 数组\n    if not url:\n        items = data.get(\"data\", [])\n   \
          \     if items and isinstance(items[0], dict):\n            url = items[0].get(\"\
          url\") or \"\"\n    return {\"image_url\": url, \"raw\": body[:500]}\n"
        code_language: python3
        desc: 从接口响应中解析图片 URL（images[0].url，兼容 data[0].url）
        outputs:
          image_url:
            children: null
            type: string
          raw:
            children: null
            type: string
        selected: false
        title: 解析图片地址
        type: code
        variables:
        - value_selector:
          - node-http-image
          - body
          variable: body
      height: 95
      id: node-parse-image
      position:
        x: 980
        y: 282
      positionAbsolute:
        x: 980
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 241
    - data:
        answer: '**① LLM 格式化输出结果**：


          {{#node-llm.text#}}


          ---


          **② 多媒体生成结果**（按你的输入描述生成）：


          ![生成的图片]({{#node-parse-image.image_url#}})


          **图片地址**：{{#node-parse-image.image_url#}}'
        desc: ''
        selected: false
        title: 直接回复
        type: answer
        variables: []
      height: 204
      id: node-answer
      position:
        x: 1280
        y: 282
      positionAbsolute:
        x: 1280
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 241
    viewport:
      x: -657.9015105756421
      y: -321.3183757227839
      zoom: 1.515716566510398
  rag_pipeline_variables: []
